<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web PDF Scanner</title>
    
    <!-- Tailwind CSS for mobile-first modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jsPDF Library for generating the PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Cropper.js Library for cropping the document -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        /* Hide scrollbars for a clean app-like feel */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }
        
        /* Shutter animation effect */
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flash-effect {
            animation: flash 0.5s ease-out;
            pointer-events: none;
        }
        
        /* Ensure cropper fits the screen */
        .cropper-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-white font-sans">

    <!-- Header -->
    <header class="absolute top-0 w-full z-10 p-4 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center">
        <h1 class="text-lg font-semibold tracking-wide flex items-center gap-2">
            Scanner
            <span id="headerBatchBadge" class="hidden bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow">0 pages</span>
        </h1>
        <div class="flex items-center gap-4">
            <button id="headerGeneratePdfBtn" class="hidden px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg shadow-lg active:bg-blue-700 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                PDF
            </button>
            <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
        </div>
    </header>

    <!-- Main Viewfinder Area -->
    <main class="flex-grow relative flex justify-center items-center overflow-hidden bg-gray-900">
        
        <!-- Live Video Feed -->
        <!-- 'playsinline' is crucial for iOS so it doesn't open in fullscreen media player -->
        <video id="cameraFeed" class="absolute w-full h-full object-cover" autoplay playsinline></video>
        
        <!-- Hidden Canvas for capturing the high-res image -->
        <canvas id="captureCanvas" class="hidden"></canvas>
        
        <!-- Preview of the captured image -->
        <img id="imagePreview" class="absolute w-full h-full object-contain hidden bg-black" alt="Captured Document" />

        <!-- Cropper Image container -->
        <img id="cropperImage" class="absolute max-w-full block hidden" alt="Crop Document" />

        <!-- Camera framing guides -->
        <div id="guides" class="absolute inset-8 border-2 border-white/30 rounded-lg pointer-events-none flex flex-col justify-between">
            <div class="flex justify-between w-full h-8">
                <div class="w-8 h-full border-t-4 border-l-4 border-blue-500 rounded-tl-lg"></div>
                <div class="w-8 h-full border-t-4 border-r-4 border-blue-500 rounded-tr-lg"></div>
            </div>
            <div class="flex justify-between w-full h-8">
                <div class="w-8 h-full border-b-4 border-l-4 border-blue-500 rounded-bl-lg"></div>
                <div class="w-8 h-full border-b-4 border-r-4 border-blue-500 rounded-br-lg"></div>
            </div>
        </div>

        <!-- Shutter Flash Overlay -->
        <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 hidden"></div>

        <!-- Error/Message Overlay -->
        <div id="messageOverlay" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-50">
            <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h2 class="text-xl font-bold mb-2">Camera Access Required</h2>
            <p class="text-sm text-gray-300 mb-6">Please allow camera permissions to scan documents.</p>
            <button id="retryButton" class="px-6 py-3 bg-blue-600 rounded-full font-semibold active:bg-blue-700 transition-colors">Grant Permission</button>
        </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="absolute bottom-0 w-full p-6 pb-8 bg-black/80 flex justify-center items-center h-32 backdrop-blur-sm z-10">
        
        <!-- Scanning Controls (Default) -->
        <div id="scanControls" class="flex justify-center items-center w-full">
            <button id="captureBtn" class="w-20 h-20 rounded-full border-4 border-white/50 bg-transparent flex justify-center items-center focus:outline-none active:scale-95 transition-transform" aria-label="Take Photo">
                <div class="w-16 h-16 bg-white rounded-full"></div>
            </button>
        </div>

        <!-- Crop Controls (Hidden initially) -->
        <div id="cropControls" class="hidden w-full flex justify-between items-center px-4 max-w-md mx-auto">
            <button id="cancelCropBtn" class="px-5 py-3 rounded-xl bg-gray-800 text-white font-medium active:bg-gray-700 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                Cancel
            </button>
            <button id="applyCropBtn" class="px-6 py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/30 active:bg-blue-700 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Crop
            </button>
        </div>

        <!-- Preview Controls (Hidden initially) -->
        <div id="previewControls" class="hidden w-full flex justify-between items-center px-4 max-w-md mx-auto">
            <button id="retakeBtn" class="p-3 rounded-xl bg-gray-800 text-white font-medium active:bg-gray-700 transition-colors flex items-center justify-center" aria-label="Retake">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
            </button>
            <button id="toggleFilterBtn" class="px-4 py-3 rounded-xl bg-gray-800 text-gray-300 font-medium active:bg-gray-700 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                B&W Filter
            </button>
            <button id="addToBatchBtn" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/30 active:bg-blue-700 transition-colors flex items-center gap-2">
                Add Page
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>
    </footer>

    <script>
        // DOM Elements
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('captureCanvas');
        const preview = document.getElementById('imagePreview');
        const guides = document.getElementById('guides');
        
        const cropperImage = document.getElementById('cropperImage');
        
        const scanControls = document.getElementById('scanControls');
        const cropControls = document.getElementById('cropControls');
        const previewControls = document.getElementById('previewControls');
        
        const captureBtn = document.getElementById('captureBtn');
        const applyCropBtn = document.getElementById('applyCropBtn');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const toggleFilterBtn = document.getElementById('toggleFilterBtn');
        const addToBatchBtn = document.getElementById('addToBatchBtn');
        const headerGeneratePdfBtn = document.getElementById('headerGeneratePdfBtn');
        const headerBatchBadge = document.getElementById('headerBatchBadge');
        const retryBtn = document.getElementById('retryButton');
        
        const flashOverlay = document.getElementById('flashOverlay');
        const messageOverlay = document.getElementById('messageOverlay');
        const statusIndicator = document.getElementById('statusIndicator');

        let currentStream = null;
        let capturedImageData = null;
        
        // Batch Tracking Array
        let batchImages = [];
        
        // Cropping and Filtering state
        let cropper = null;
        let croppedImageData = null;
        let filteredImageData = null;
        let isFilterApplied = false;

        // Initialize Camera
        async function startCamera() {
            // Prefer the rear camera on mobile devices
            const constraints = {
                video: {
                    facingMode: 'environment', 
                    width: { ideal: 1920 }, // Try to get high resolution for document clarity
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                // Hide message overlay on success
                messageOverlay.classList.add('hidden');
                statusIndicator.classList.remove('bg-red-500', 'animate-pulse');
                statusIndicator.classList.add('bg-green-500');
                
            } catch (err) {
                console.error("Camera error:", err);
                messageOverlay.classList.remove('hidden');
                messageOverlay.querySelector('p').textContent = 
                    err.name === 'NotAllowedError' 
                    ? "Camera permission was denied. Please allow access in your browser settings."
                    : "Unable to access the camera. Make sure your device has a camera and it is not in use.";
            }
        }

        // Stop Camera
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                statusIndicator.classList.remove('bg-green-500');
                statusIndicator.classList.add('bg-red-500', 'animate-pulse');
            }
        }

        // Capture functionality
        captureBtn.addEventListener('click', () => {
            if (!currentStream) return;

            // Trigger shutter flash
            flashOverlay.classList.remove('hidden');
            flashOverlay.classList.add('flash-effect');
            setTimeout(() => {
                flashOverlay.classList.remove('flash-effect');
                flashOverlay.classList.add('hidden');
            }, 500);

            // Set canvas dimensions to match the actual video stream resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw current video frame onto canvas
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert to base64 JPEG (Quality 1.0 for cropping)
            capturedImageData = canvas.toDataURL('image/jpeg', 1.0);
            
            // Update UI: Hide video and guides, show cropper
            video.classList.add('hidden');
            guides.classList.add('hidden');
            
            cropperImage.src = capturedImageData;
            cropperImage.classList.remove('hidden');
            
            // Swap controls
            scanControls.classList.add('hidden');
            cropControls.classList.remove('hidden');
            
            // Turn off camera to save battery while editing
            stopCamera();

            // Initialize Cropper.js
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropperImage, {
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 0.95,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
        });

        // Crop Application
        applyCropBtn.addEventListener('click', () => {
            if (!cropper) return;
            
            // Get the cropped area as a canvas
            const croppedCanvas = cropper.getCroppedCanvas();
            croppedImageData = croppedCanvas.toDataURL('image/jpeg', 0.9);
            
            // Pre-calculate the filtered (scanned) version using canvas filters
            const filterCanvas = document.createElement('canvas');
            filterCanvas.width = croppedCanvas.width;
            filterCanvas.height = croppedCanvas.height;
            const ctx = filterCanvas.getContext('2d');
            // Apply a typical document scanner look: grayscale, high contrast, slight brightness boost
            ctx.filter = 'grayscale(100%) contrast(150%) brightness(120%)';
            ctx.drawImage(croppedCanvas, 0, 0);
            filteredImageData = filterCanvas.toDataURL('image/jpeg', 0.9);
            
            // Cleanup cropper
            cropper.destroy();
            cropper = null;
            cropperImage.classList.add('hidden');
            cropperImage.src = '';
            
            // Update UI: Show preview image
            preview.src = croppedImageData;
            preview.classList.remove('hidden');
            
            // Reset filter state
            isFilterApplied = false;
            toggleFilterBtn.classList.remove('bg-blue-600', 'text-white');
            toggleFilterBtn.classList.add('bg-gray-800', 'text-gray-300');
            
            // Swap controls
            cropControls.classList.add('hidden');
            previewControls.classList.remove('hidden');
        });

        // Cancel Crop / Go back to camera
        cancelCropBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            cropperImage.classList.add('hidden');
            cropperImage.src = '';
            
            cropControls.classList.add('hidden');
            scanControls.classList.remove('hidden');
            
            video.classList.remove('hidden');
            guides.classList.remove('hidden');
            
            startCamera();
        });

        // Toggle Filter
        toggleFilterBtn.addEventListener('click', () => {
            isFilterApplied = !isFilterApplied;
            
            // Update preview image
            preview.src = isFilterApplied ? filteredImageData : croppedImageData;
            
            // Update button styling
            if (isFilterApplied) {
                toggleFilterBtn.classList.add('bg-blue-600', 'text-white');
                toggleFilterBtn.classList.remove('bg-gray-800', 'text-gray-300');
            } else {
                toggleFilterBtn.classList.remove('bg-blue-600', 'text-white');
                toggleFilterBtn.classList.add('bg-gray-800', 'text-gray-300');
            }
        });

        // Retake functionality
        retakeBtn.addEventListener('click', () => {
            croppedImageData = null;
            filteredImageData = null;
            
            // Update UI: Hide preview, show video and guides
            preview.classList.add('hidden');
            preview.src = '';
            video.classList.remove('hidden');
            guides.classList.remove('hidden');
            
            // Swap controls
            previewControls.classList.add('hidden');
            scanControls.classList.remove('hidden');
            
            // Restart camera
            startCamera();
        });

        function updateBatchUI() {
            if (batchImages.length > 0) {
                headerBatchBadge.textContent = `${batchImages.length} page${batchImages.length > 1 ? 's' : ''}`;
                headerBatchBadge.classList.remove('hidden');
                headerGeneratePdfBtn.classList.remove('hidden');
            } else {
                headerBatchBadge.classList.add('hidden');
                headerGeneratePdfBtn.classList.add('hidden');
            }
        }

        // Add to Batch functionality
        addToBatchBtn.addEventListener('click', () => {
            const targetData = isFilterApplied ? filteredImageData : croppedImageData;
            if (!targetData) return;
            
            // Add image to batch
            batchImages.push(targetData);
            updateBatchUI();

            // Flash effect for feedback
            flashOverlay.classList.remove('hidden');
            flashOverlay.classList.add('flash-effect');
            setTimeout(() => {
                flashOverlay.classList.remove('flash-effect');
                flashOverlay.classList.add('hidden');
            }, 500);

            // Reset and go back to scanning
            croppedImageData = null;
            filteredImageData = null;
            
            preview.classList.add('hidden');
            preview.src = '';
            video.classList.remove('hidden');
            guides.classList.remove('hidden');
            
            previewControls.classList.add('hidden');
            scanControls.classList.remove('hidden');
            
            startCamera();
        });

        // Batch PDF Generation functionality
        headerGeneratePdfBtn.addEventListener('click', () => {
            if (batchImages.length === 0) return;
            
            const originalText = headerGeneratePdfBtn.innerHTML;
            headerGeneratePdfBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Processing...
            `;
            headerGeneratePdfBtn.disabled = true;

            setTimeout(() => {
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    
                    batchImages.forEach((imgData, index) => {
                        if (index > 0) pdf.addPage();
                        
                        const imgProps = pdf.getImageProperties(imgData);
                        const ratio = imgProps.width / imgProps.height;
                        
                        let targetWidth = pageWidth;
                        let targetHeight = pageWidth / ratio;
                        
                        if (targetHeight > pageHeight) {
                            targetHeight = pageHeight;
                            targetWidth = pageHeight * ratio;
                        }
                        
                        const xPos = (pageWidth - targetWidth) / 2;
                        const yPos = (pageHeight - targetHeight) / 2;
                        
                        pdf.addImage(imgData, 'JPEG', xPos, yPos, targetWidth, targetHeight);
                    });
                    
                    const date = new Date();
                    const timestamp = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2, '0')}${date.getDate().toString().padStart(2, '0')}_${date.getHours()}${date.getMinutes()}`;
                    
                    pdf.save(`Scanned_Batch_${timestamp}.pdf`);

                    headerGeneratePdfBtn.innerHTML = `
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Saved!
                    `;
                    headerGeneratePdfBtn.classList.remove('bg-blue-600');
                    headerGeneratePdfBtn.classList.add('bg-green-600');

                    setTimeout(() => {
                        headerGeneratePdfBtn.innerHTML = originalText;
                        headerGeneratePdfBtn.classList.remove('bg-green-600');
                        headerGeneratePdfBtn.classList.add('bg-blue-600');
                        headerGeneratePdfBtn.disabled = false;
                        
                        // Clear batch after successful save
                        batchImages = [];
                        updateBatchUI();
                    }, 2000);

                } catch (error) {
                    console.error("PDF Generation Error: ", error);
                    headerGeneratePdfBtn.innerHTML = "Error saving";
                    headerGeneratePdfBtn.classList.replace('bg-blue-600', 'bg-red-600');
                    setTimeout(() => {
                        headerGeneratePdfBtn.innerHTML = originalText;
                        headerGeneratePdfBtn.classList.replace('bg-red-600', 'bg-blue-600');
                        headerGeneratePdfBtn.disabled = false;
                    }, 3000);
                }
            }, 100);
        });

        // Retry camera permissions button
        retryBtn.addEventListener('click', startCamera);

        // Start camera on page load
        window.addEventListener('load', startCamera);
        
    </script>
</body>
</html>
